services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propvault_prod_backend
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 4 --timeout 120"
    volumes:
      - static_volume:/app/staticfiles
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - USE_S3=True
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propvault_prod_celery_worker
    restart: always
    command: celery -A config worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - USE_S3=True
    depends_on:
      - web

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propvault_prod_celery_beat
    restart: always
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - USE_S3=True
    depends_on:
      - web

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: propvault_prod_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  static_volume:
